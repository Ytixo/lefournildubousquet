<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fournil du Bousquet</title>
    <link rel="shortcut icon" type="image" href="assets/img/bread slice light.png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style-login.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="back">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i></a>
            </div>
            <div class="logo">
                <i class="fas fa-bread-slice"></i>
                <a href="index.html"><h1>Le Fournil du Bousquet</h1></a>
            </div>
        </div>
    </header>

    <section>
        <h1>Connexion</h1>
        <div class="input-box">
            <input id="pass" type="password" name="password" placeholder="Mot de passe" onkeydown="handleKey(event)">
            <i class="fa-solid fa-eye" onclick="togglePassword()"></i>
        </div>
        <button class="login-btn" onclick="password()">Se connnecter</button>
    </section>

    <script>
        function togglePassword() {
            const input = document.getElementById("pass");

            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
        function handleKey(event) {
            if (event.key === "Enter") {
                password();
            }
        }
        function password() {
            var pass = document.getElementById("pass").value;
            const handle = window.location.href = pass + "_admin.html";
            if (!handle) {
                alert("Mot de passe incorrect");
            }
           
        }
    </script>
</body>
</html>
