<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/style-admin.css">
    <title>Dashboard</title>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-bread-slice"></i>
                <h1>Le Fournil du Bousquet</h1>
            </div>
            <div class="menu">
                <button id="menu-btn" style="background:none;border:none;cursor:pointer;">
                    <i class="fas fa-bars"></i>
                </button>
                <nav>
                    <ul id="menu-list">
                        <li><a href="#accueil">Accueil</a></li>
                        <li><a href="#produits">Produits</a></li>
                        <li><a href="#a-propos">À Propos</a></li>
                        <li><a href="#horaires">Horaires</a></li>
                        <li><a href="login-register.html">Se connecter</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section id="facture">
        <h2>Créer une facture</h2>
        <form id="invoice-form">
            <label for="client">Client :</label>
            <select id="client">
                <option value="Noah BERTRAND">Noah BERTRAND</option>
                <option value="Noam M'SAKNI">Noam M'SAKNI</option>
                <option value="Baptiste BAUBINEAU">Baptiste BAUBINEAU</option>
                <option value="Gabriel AILLET">Gabriel AILLET</option>
            </select>
            <button type="submit">Générer PDF</button>
        </form>
    </section>

    <section id="add-client-section">
        <h2>Ajouter un client</h2>
        <input type="text" id="new-client-name" placeholder="Nom du client">
        <button id="add-client-btn">Ajouter</button>
    </section>

    <section id="add-purchase-section">
        <h2>Ajouter un achat</h2>
        <select id="client-select"></select>

        <div id="invoice-items-container">
            <div class="item">
                <input type="text" placeholder="Produit" class="product-name">
                <input type="number" placeholder="Quantité" class="product-qty" min="1" value="1">
                <input type="number" placeholder="Prix (€)" class="product-price" step="0.01" value="0">
                <button type="button" class="remove-item">Supprimer</button>
            </div>
        </div>
        <button type="button" id="add-invoice-item">Ajouter un produit</button>
        <button type="button" id="save-purchase">Enregistrer achat</button>
    </section>

    <script src="assets/js/admin.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
